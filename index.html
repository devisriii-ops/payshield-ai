<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PayPal Shield AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{--pb:#003087;--sb:#0070E0;--ab:#009CDE;--lb:#EAF4FF;--bg:#F5F8FC;--w:#fff;--tx:#172B4D;--t2:#63738A;--ok:#16875D;--wn:#E5A000;--dn:#D64545;--bd:#DCE5F0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Manrope,system-ui,sans-serif}
a{color:var(--sb);text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}
.btn{border:0;border-radius:10px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--sb);color:#fff;transition:background .15s}.btn:hover{background:var(--pb)}.btn.o{background:var(--w);color:var(--pb);border:1px solid var(--bd)}.btn.o:hover{background:var(--lb)}.btn.sm{padding:6px 12px;font-size:13px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--w);margin:4px 0 12px}input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ab);outline-offset:1px}label{font-size:13px;font-weight:600;color:var(--t2)}
.card{background:var(--w);border:1px solid var(--bd);border-radius:14px;padding:18px}.g{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.nav{display:flex;align-items:center;justify-content:space-between;padding:14px 5vw;background:var(--w);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5;gap:12px;flex-wrap:wrap}.nav nav{display:flex;gap:22px;flex-wrap:wrap}.nav nav a{color:var(--tx);font-weight:600}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;color:var(--pb);font-size:18px}.logo i{width:38px;height:38px;border-radius:10px;background:#fff;border:1px solid var(--bd);display:grid;place-items:center;font-style:normal}.logo i img{height:26px;width:auto}
.hero{padding:64px 5vw;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:40px;align-items:center;max-width:1200px;margin:auto}.hero h1{font-size:clamp(34px,5vw,54px);line-height:1.08;letter-spacing:-.02em;color:var(--pb);margin:0 0 16px}.hero p{color:var(--t2);font-size:17px;max-width:520px}
.sec{max-width:1200px;margin:auto;padding:44px 5vw}.sec h2{font-size:30px;margin:0 0 8px;letter-spacing:-.01em}
.app{display:flex;min-height:100vh}.side{width:232px;background:var(--pb);color:#cfe0ff;padding:16px 10px;display:flex;flex-direction:column;gap:2px;transition:width .2s;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto}.side.c{width:66px}.side.c .lbl{display:none}
.side a{color:#cfe0ff;padding:10px 12px;border-radius:10px;display:flex;gap:12px;align-items:center;font-weight:600;cursor:pointer;white-space:nowrap}.side a:hover,.side a.on{background:rgba(255,255,255,.14);color:#fff}.side .logo{color:#fff;padding:6px 8px 16px}
.main{flex:1;min-width:0;padding:24px clamp(14px,3vw,32px)}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:10px;flex-wrap:wrap}.top h1{margin:0;font-size:26px}.sub{color:var(--t2);margin:2px 0 0}
.kpi b{font-size:28px;display:block}.kpi small{color:var(--t2)}.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700}
.s-Completed,.s-Resolved,.s-Low{background:#dff3ea;color:var(--ok)}.s-Pending,.s-Submitted,.s-Medium,.s-Normal{background:#fdf1d2;color:#8a6200}.s-OnHold,.s-High,.s-Escalated,.s-Urgent,.s-Failed{background:#fbe1e1;color:var(--dn)}.s-UnderReview,.s-InfoRequired{background:var(--lb);color:var(--sb)}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:var(--t2);font-weight:600;padding:8px;border-bottom:1px solid var(--bd)}td{padding:10px 8px;border-bottom:1px solid var(--bd)}tr.c{cursor:pointer}tr.c:hover{background:var(--lb)}.tw{overflow-x:auto}
.tl{border-left:2px solid var(--bd);margin-left:8px;padding-left:18px}.tl div{position:relative;margin-bottom:14px}.tl div:before{content:"";position:absolute;left:-25px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--sb);border:2px solid var(--w)}
.chat{display:flex;flex-direction:column;height:calc(100vh - 150px);min-height:420px}.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:6px}.m{max-width:80%;padding:12px 14px;border-radius:14px}.m.u{align-self:flex-end;background:var(--sb);color:#fff}.m.a{align-self:flex-start;background:var(--lb)}.m small{opacity:.7;display:block;margin-top:4px}
.chip{border:1px solid var(--bd);background:var(--w);border-radius:99px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:600;color:var(--pb)}.chip:hover{background:var(--lb)}
.dots span{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--t2);animation:b 1s infinite}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}@keyframes b{50%{transform:translateY(-4px)}}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--sb);transition:width .4s}
.toast{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--pb);color:#fff;padding:12px 18px;border-radius:12px;z-index:9;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.fc{position:absolute;background:var(--w);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;box-shadow:0 8px 24px rgba(0,48,135,.12);font-size:13px;font-weight:700}
details{border:1px solid var(--bd);border-radius:10px;padding:10px 14px;margin-bottom:8px;background:var(--w)}summary{cursor:pointer;font-weight:700}
@media(max-width:720px){.side{position:fixed;z-index:6;left:0;transform:translateX(0)}.side.c{width:56px}.main{margin-left:56px}.nav nav{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hv{position:relative;height:380px;display:grid;place-items:center;overflow:hidden;--r:min(130px,26vw)}.ring{position:absolute;border-radius:50%;border:1.5px dashed var(--sb);opacity:.35}.r1{width:calc(var(--r)*2);height:calc(var(--r)*2);animation:pu 4s ease-in-out infinite}.r2{width:calc(var(--r)*2.7);height:calc(var(--r)*2.7);border-style:solid;opacity:.15}@keyframes pu{50%{transform:scale(1.06);opacity:.6}}
.shield{position:relative;filter:drop-shadow(0 14px 24px rgba(0,48,135,.3));animation:fl 4s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-8px)}}.ck{stroke-dasharray:80;stroke-dashoffset:80;animation:dr 3.5s ease infinite}@keyframes dr{0%{stroke-dashoffset:80}35%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:80}}
.sat{position:absolute;left:50%;top:50%;margin:-18px 0 0 -58px;width:116px;text-align:center;background:var(--w);border:1px solid var(--bd);border-radius:12px;padding:8px 6px;font-size:13px;font-weight:700;color:var(--pb);box-shadow:0 8px 24px rgba(0,48,135,.14);animation:ob 20s linear infinite}@keyframes ob{from{transform:rotate(0) translateX(var(--r)) rotate(0)}to{transform:rotate(360deg) translateX(var(--r)) rotate(-360deg)}}
.hv2 img{width:100%;height:auto;display:block;border-radius:18px;box-shadow:0 18px 48px rgba(0,48,135,.18);animation:fl 6s ease-in-out infinite}
</style></head><body><div id="root"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),cur={USD:"$",EUR:"€",GBP:"£",INR:"₹"};
const names=["Aarav Mehta","Sofia Rossi","Liam Carter","Priya Nair","Noah Fischer","Emma Dubois","Kenji Tanaka","Maya Patel","Lucas Silva","Zoe Williams","Omar Haddad","Isla Murphy","Ravi Kumar","Hannah Weber","Diego Ruiz","Ana Costa"];
const cats=["Goods","Services","Digital","Subscription","Freelance"],sts=["Completed","Completed","Completed","Pending","OnHold","Failed"],curs=["USD","EUR","GBP","INR"];
let seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
const D={tx:[],cases:[],assess:[],notifs:[],chat:[],last:null,user:null,role:"Customer",nav:{},notes:{}};
for(let i=0;i<34;i++){const c=curs[i%4];D.tx.push({id:"TX-"+(4001+i),cust:names[i%16],amt:Math.round((c=="INR"?(rnd()*90000+500):(rnd()*2400+20))*100)/100,cur:c,date:new Date(2026,10,10-i).toISOString().slice(0,10),cat:cats[i%5],st:sts[Math.floor(rnd()*6)]})}
const issues=["Payment Pending","Funds on Hold","Account Limitation","Verification","Refund","Chargeback","Login Problem","Transaction Issue"],cst=["Submitted","Under Review","InfoRequired","Escalated","Resolved"],pri=["Normal","Medium","High","Urgent"],agents=["Daniel Okoye","Mei Lin","Sara Haddad"];
for(let i=0;i<14;i++){const t=D.tx[i*2];D.cases.push({id:"CS-"+(1001+i),tx:t.id,cust:t.cust,issue:issues[i%8],pri:pri[(i*3)%4==0?2:i%4],st:cst[i%5],created:t.date,upd:new Date(2026,10,10-(i%6)).toISOString().slice(0,10),agent:agents[i%3],sum:"Customer reported "+issues[i%8].toLowerCase()+" on "+t.id+" ("+cur[t.cur]+t.amt.toLocaleString()+"). AI guidance given; escalated for human review.",hist:[["Case submitted",t.date],["Assigned to "+agents[i%3],t.date]]})}
["Low","Medium","High","Low","Medium","Low","High","Medium","Low","Medium","Low","High"].forEach((l,i)=>D.assess.push({id:"RA-"+(201+i),cust:names[i],level:l,date:D.tx[i].date,factors:[l=="Low"?"Verified account, complete profile":"Incomplete profile details"],tx:D.tx[i].id}));
D.notifs=[{t:"Case CS-1001 is now Under Review",d:"Today"},{t:"Additional information requested on CS-1003",d:"Yesterday"},{t:"Case CS-1005 resolved",d:"Nov 7"}];
const KB=[{k:/pend/i,i:"Payment Pending",e:"Payments can show as pending while they are processed, reviewed, or waiting on buyer or seller action.",s:["PayPal Help Centre: Pending payments"]},
{k:/hold|held|funds/i,i:"Funds on Hold",e:"Funds may be held for general reasons, such as account age, unusual activity, or incomplete delivery information. The exact reason is determined by PayPal.",s:["PayPal Help Centre: Payment holds"]},
{k:/limit|restrict/i,i:"Account Limitation",e:"Limitations usually ask for information or documents to restore full access.",s:["PayPal Help Centre: Account limitations"]},
{k:/verif|identity|kyc/i,i:"Verification",e:"Verification typically needs identity and account details submitted through the official account page.",s:["PayPal Help Centre: Confirm your identity"]},
{k:/refund/i,i:"Refund",e:"Refund timing depends on the original funding method and processing time.",s:["PayPal Help Centre: Refund status"]},
{k:/charge ?back|dispute/i,i:"Chargeback",e:"A chargeback starts with the card issuer. Respond to requests with documents such as proof of delivery.",s:["PayPal Help Centre: Disputes and chargebacks"]},
{k:/login|log in|password|sign in/i,i:"Login Problem",e:"Use the official password reset flow. Support will never ask for your password or codes.",s:["PayPal Help Centre: Login help"]},
{k:/.*/,i:"Transaction Issue",e:"I need a few more details to classify this transaction issue.",s:["PayPal Help Centre: Transactions"]}];

function donut(parts){const tot=parts.reduce((a,b)=>a+b[1],0);let off=0;const C=2*Math.PI*40;return `<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 100 100" width="150" style="transform:rotate(-90deg)">${parts.map(([n,v,c])=>{const l=v/tot*C,s=`<circle cx="50" cy="50" r="40" fill="none" stroke="${c}" stroke-width="16" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}"><title>${n}: ${v}</title></circle>`;off+=l;return s}).join("")}</svg><div>${parts.map(([n,v,c])=>`<div><span style="color:${c}">●</span> ${n} <b>${v}</b></div>`).join("")}</div></div>`}

<div class="sec" id="f"><h2>Five connected capabilities</h2><p class="sub">Each step feeds context to the next, so support never starts from zero.</p><div class="g g2" style="margin-top:20px">${[["Intelligent Payment Readiness","Explainable checklist that shows which details may draw review.","readiness"],["Payment Hold Intelligence","Plain-language explanation of notices, without guessing internal reasons.","holds"],["AI Customer Support","Grounded answers with facts, unknowns and sources.","support"],["Smart Case Escalation","Structured cases prepared from your conversation.","support"],["Transparent Case Tracking","Timeline of every update and required action.","cases"]].map(f=>`<div class="card"><h3 style="margin:0 0 6px;color:var(--pb)">${f[0]}</h3><p class="sub">${f[1]}</p><a href="#/login" class="btn o sm" style="display:inline-block;margin-top:10px">Try it</a></div>`).join("")}</div></div>
<div class="sec" id="h"><h2>How it works</h2><div class="g g4" style="margin-top:16px">${["Assess readiness","Understand a notice","Ask AI support","Track your case"].map((s,i)=>`<div class="card"><b style="color:var(--sb)">Step ${i+1}</b><br>${s}</div>`).join("")}</div></div>
<div class="sec" id="s"><h2>Security and transparency</h2><div class="card"><p>PayPal Shield AI is a hackathon prototype, not an official PayPal product. It cannot see PayPal systems or decide payment restrictions, and it never guarantees a payment will avoid review. It will never ask for passwords, one-time codes or full card numbers.</p></div></div>
<div class="sec" id="q"><h2>Frequently asked questions</h2><details><summary>Does PayPal Shield AI predict PayPal decisions?</summary><p>No. It is an explainable awareness tool based on general factors.</p></details><details><summary>Is this PayPal?</summary><p>It is a hackathon prototype built around PayPal-style payment support, not an official PayPal product.</p></details><details><summary>What happens when AI cannot help?</summary><p>You review a prepared case and submit it for human support review.</p></details></div>

function table(h,rows,click){return `<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${rows.map(r=>`<tr class="c" onclick="${r[0]}">${r[1].map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")}</table></div>`}
function overview(){const t=D.tx,open=D.cases.filter(c=>c.st!="Resolved").length;const kp=[["Total Transactions",t.length,"+8% vs last month"],["Successful Payments",cnt(t,"st","Completed"),"+5%"],["Pending Payments",cnt(t,"st","Pending"),"-2%"],["Cases Under Review",D.cases.filter(c=>c.st=="Under Review").length,open+" open overall"]];
const att=["Low","Medium","High"].map(l=>[l,cnt(D.assess,"level",l)]);
return shell("overview","Welcome back!","Here is your payment intelligence overview.",`<div class="g g4">${kp.map(k=>`<div class="card kpi"><small>${k[0]}</small><b>${k[1]}</b><small style="color:var(--ok)">${k[2]}</small></div>`).join("")}</div>
<div class="g g2" style="margin-top:16px"><div class="card"><b>Transaction activity</b>${line(byDay())}</div><div class="card"><b>Payment distribution</b><br><br>${donut([["Successful",cnt(t,"st","Completed"),"#16875D"],["Pending",cnt(t,"st","Pending"),"#E5A000"],["On Hold",cnt(t,"st","OnHold"),"#0070E0"],["Failed",cnt(t,"st","Failed"),"#D64545"]])}</div></div>
<div class="g g2" style="margin-top:16px"><div class="card"><b>Recent transactions</b>${table(["ID","Customer","Amount","Date","Status"],t.slice(0,5).map(x=>["go('/tx/"+x.id+"')",[x.id,x.cust,fmt(x)+" "+x.cur,x.date,tag(x.st)]]))}</div><div class="card"><b>Payment attention overview</b>${att.map(a=>`<p style="margin:10px 0 2px">${a[0]} attention <b>${a[1]}</b></p><div class="bar"><i style="width:${a[1]/D.assess.length*100}%;background:${a[0]=="Low"?"var(--ok)":a[0]=="Medium"?"var(--wn)":"var(--dn)"}"></i></div>`).join("")}</div></div>
<div class="g g2" style="margin-top:16px"><div class="card"><b>Recent support cases</b>${table(["Case","Issue","Priority","Status"],D.cases.slice(-5).reverse().map(c=>["go('/case/"+c.id+"')",[c.id,c.issue,tag(c.pri),tag(c.st)]]))}</div><div class="card"><b>AI insights</b><ul><li>${cnt(t,"st","OnHold")} payments are on hold. Add tracking details to related orders.</li><li>${D.assess.filter(a=>a.level=="High").length} assessments need attention. Complete profile and verification.</li><li>${open} cases are open. Reply quickly to information requests.</li></ul><div style="display:flex;gap:8px;flex-wrap:wrap"><a class="chip" href="#/readiness">Check Payment Readiness</a><a class="chip" href="#/holds">Explain a Payment Hold</a><a class="chip" href="#/support">Ask AI Support</a><a class="chip" href="#/cases">Track a Case</a></div></div></div>`)}
const W={step:0,a:{buyer:"New",amt:"",cur:"USD",cat:"Goods",age:"Under 30 days",prof:"Incomplete",ver:"Unverified",ptype:"Physical",dm:"Courier",fs:"Not shipped",tl:"Over 14 days",vol:"No change"}};
function readiness(){const a=W.a,sel=(k,o)=>`<select onchange="W.a.${k}=this.value">${o.map(x=>`<option ${a[k]==x?"selected":""}>${x}</option>`).join("")}</select>`;let b;
if(W.step==0)b=`<label>Buyer type</label>${sel("buyer",["New","Existing"])}<label>Transaction amount</label><input type="number" min="1" value="${a.amt}" oninput="W.a.amt=this.value" placeholder="e.g. 1500"><label>Currency</label>${sel("cur",curs)}<label>Payment category</label>${sel("cat",cats)}`;
if(W.step==1)b=`<label>Account age</label>${sel("age",["Under 30 days","1 to 6 months","Over 6 months"])}<label>Seller profile</label>${sel("prof",["Incomplete","Complete"])}<label>Verification status</label>${sel("ver",["Unverified","Verified"])}<label>Recent transaction volume</label>${sel("vol",["No change","Sudden increase"])}`;
if(W.step==2)b=`<label>Product or service</label>${sel("ptype",["Physical","Digital","Service"])}<label>Delivery method</label>${sel("dm",["Courier","Email delivery","In person","Not decided"])}<label>Fulfilment status</label>${sel("fs",["Not shipped","Shipped with tracking","Delivered"])}<label>Expected delivery</label>${sel("tl",["Within 7 days","8 to 14 days","Over 14 days"])}`;
if(W.step==3)return shell("readiness","Payment Readiness","Explainable awareness check, not a PayPal decision.",result());
return shell("readiness","Payment Readiness","Step "+(W.step+1)+" of 3",`<div class="card" style="max-width:560px"><div class="bar"><i style="width:${(W.step+1)/3*100}%"></i></div><br>${b}<div style="display:flex;justify-content:space-between">${W.step?`<button class="btn o" onclick="W.step--;route()">Back</button>`:"<span></span>"}<button class="btn" onclick="nextW()">${W.step==2?"Run analysis":"Continue"}</button></div></div>${D.assess.length?`<p class="sub">${D.assess.length} saved assessments appear in your overview.</p>`:""}`)}
function nextW(){if(W.step==0&&!(+W.a.amt>0))return toast("Enter an amount greater than 0");W.step++;route()}
function analyse(){const a=W.a,f=[],ok=[];let s=0;
const add=(c,p,t,why,good)=>c?(s+=p,f.push([t,why])):ok.push(good);
add(a.age=="Under 30 days",2,"New account","Newer accounts have less history for review.","Established account age");
add(+a.amt>(a.buyer=="New"?1000:3000),2,"Higher than typical amount","Large amounts relative to a usual baseline can draw attention.","Amount is within a typical range");
add(a.prof=="Incomplete",2,"Incomplete seller profile","Missing profile details reduce clarity.","Profile complete");
add(a.ver=="Unverified",2,"Account not verified","Verification helps confirm identity.","Account verified");
add(a.vol=="Sudden increase",1,"Sudden volume change","Abrupt change from usual activity.","Stable volume");
add(a.buyer=="New",1,"New buyer","First-time buyers have no shared history.","Existing buyer");
add(a.dm=="Not decided"||a.fs=="Not shipped",1,"Missing fulfilment information","No tracking or delivery plan on record.","Fulfilment evidence available");
add(a.tl=="Over 14 days",1,"Long delivery timeline","Longer waits keep funds exposed to disputes.","Reasonable delivery timeline");
const level=s<=2?"Low":s<=5?"Medium":"High";return{level,s,f,ok,a:{...a},date:"2026-11-10",id:"RA-"+(201+D.assess.length),cust:D.user?.name||"You"}}
function result(){const r=W.res||(W.res=analyse());const c=r.level=="Low"?"var(--ok)":r.level=="Medium"?"var(--wn)":"var(--dn)";
const acts=r.f.map(x=>"Address: "+x[0].toLowerCase());
return `<div class="g g2"><div class="card"><b>Overall attention level</b><h1 style="color:${c};margin:8px 0">${r.level.toUpperCase()} ATTENTION</h1><div class="bar"><i style="width:${Math.min(100,r.s/10*100+8)}%;background:${c}"></i></div><p>${r.level=="Low"?"Minimal concerns identified.":r.level=="Medium"?"Some information needs attention.":"Multiple indicators need review. Complete the actions below."} This does not predict or guarantee any PayPal decision.</p><button class="btn" onclick="saveA()">Save assessment</button> <button class="btn o" onclick="W.step=0;W.res=null;route()">Reassess</button> <a class="btn o" href="#/holds">Explain a notice</a></div>
<div class="card"><b>Contributing factors</b>${r.f.length?r.f.map(x=>`<details><summary>${x[0]}</summary>${x[1]}</details>`).join(""):"<p>No contributing factors found.</p>"}<b>Positive indicators</b><ul>${r.ok.map(x=>`<li style="color:var(--ok)">${x}</li>`).join("")}</ul></div></div>
<div class="card" style="margin-top:16px"><b>Completion checklist</b>${(acts.length?acts:["Keep records of delivery and communication"]).map(x=>`<label style="display:block;color:var(--tx)"><input type="checkbox" style="width:auto;margin:0 8px 0 0">${x}</label>`).join("")}</div>
<div class="card" style="margin-top:16px"><b>Previous assessments</b>${table(["ID","Customer","Level","Date"],D.assess.slice(-5).reverse().map(a=>["",[a.id,a.cust,tag(a.level),a.date]]))}</div>`}
function saveA(){const r=W.res;if(D.assess.find(a=>a.id==r.id))return toast("Already saved");D.assess.push({id:r.id,cust:r.cust,level:r.level,date:r.date,factors:r.f.map(x=>x[0]),tx:"-"});D.last=r;D.notifs.unshift({t:"Assessment "+r.id+" saved ("+r.level+" attention)",d:"Now"});toast("Assessment saved. Support will use it as context.")}
const H={type:"Payment Pending",ref:"",msg:"",ctx:"",out:null};
function holds(){const types=["Payment Pending","Payment On Hold","Account Limitation","Identity Verification","Refund Delay","Transaction Review"];
return shell("holds","Payment Hold Explanation","Understand a notice without guessing internal reasons.",`<div class="g g2"><div class="card"><label>Notice type</label><select onchange="H.type=this.value">${types.map(t=>`<option ${H.type==t?"selected":""}>${t}</option>`).join("")}</select><label>Transaction reference</label><input value="${H.ref}" oninput="H.ref=this.value" placeholder="TX-4001"><label>Notification message</label><textarea rows="3" oninput="H.msg=this.value">${H.msg}</textarea><label>Additional context</label><textarea rows="2" oninput="H.ctx=this.value">${H.ctx}</textarea><button class="btn" onclick="explain()">Explain this notice</button></div><div id="ex">${H.out?exOut():'<div class="card sub">Your structured explanation appears here.</div>'}</div></div>`)}
function explain(){if(!H.msg.trim()&&!H.ref.trim())return toast("Add a reference or the notification text");if(/otp|password|\b\d{13,16}\b/i.test(H.msg+H.ctx))return toast("Remove passwords, codes or card numbers first");$("#ex").innerHTML='<div class="card"><b>Analysing notice…</b><div class="bar"><i id="pr" style="width:5%"></i></div></div>';setTimeout(()=>{pr.style.width="100%"},50);setTimeout(()=>{H.out=1;$("#ex").innerHTML=exOut()},900)}
function exOut(){const kb=KB.find(k=>k.k.test(H.type))||KB[0],tx=D.tx.find(t=>t.id==H.ref.trim().toUpperCase()),la=D.last;
return `<div class="card"><span class="tag s-UnderReview">${H.type}</span>${[["What the notice says",H.msg||"No message text provided."],["What is known",tx?"Record "+tx.id+": "+fmt(tx)+" "+tx.cur+", status "+tx.st+".":"No matching transaction record found for the reference.",""+(la?" Latest readiness: "+la.level+" attention.":"")],["Possible general explanations",kb.e],["What remains unknown","The exact reason and timing. PayPal Shield AI cannot see PayPal systems."],["Recommended next steps","Check your account notifications, provide any requested documents, and keep proof of delivery or communication."],["Official help",kb.s[0]]].map(x=>`<details open><summary>${x[0]}</summary>${x[1]}${x[2]||""}</details>`).join("")}<a class="btn" href="#/support" onclick="D.seed='${H.type}: ${H.ref}'">Continue with AI Support</a></div>`}
function support(){const sug=["Why is my payment pending?","Why are my funds on hold?","How do I complete verification?","How can I track my refund?","I need human support"];
return shell("support","AI Support Copilot","Grounded answers. Never share passwords, codes or full card numbers.",`<div class="card chat"><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">${sug.map(s=>`<button class="chip" onclick="send('${s}')">${s}</button>`).join("")}<button class="chip" onclick="D.chat=[];route()">New conversation</button><button class="btn sm" onclick="startCase()">Connect to Support</button></div><div class="msgs" id="ms">${D.chat.length?D.chat.map(msg).join(""):'<div class="sub">Ask about a pending payment, hold, refund, verification or login problem.</div>'}</div><div style="display:flex;gap:8px;margin-top:10px"><input id="ci" style="margin:0" placeholder="Describe your issue" onkeydown="if(event.key=='Enter')send()"><button class="btn" onclick="send()">Send</button></div></div>`)}
const msg=m=>`<div class="m ${m.r}">${m.h}<small>${m.t}</small></div>`;
function send(t){t=t||ci.value.trim();if(!t)return;ci.value="";const now=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});D.chat.push({r:"u",h:t.replace(/</g,"&lt;"),t:now});
const ms=$("#ms");ms.innerHTML=D.chat.map(msg).join("")+'<div class="m a dots"><span></span><span></span><span></span></div>';ms.scrollTop=1e5;
setTimeout(()=>{let h;if(/otp|password|passcode|\b\d{13,16}\b/i.test(t))h="<b>Please stop.</b> Never share passwords, codes or full card numbers here. Remove them and describe the issue instead.";else if(/human|agent|person/i.test(t)){h="I can prepare a case for human review. Choose <b>Connect to Support</b> to review it first.";D.esc=1}else{const k=KB.find(k=>k.k.test(t)),la=D.last,tid=(t.match(/TX-\d+/i)||[])[0],tx=tid&&D.tx.find(x=>x.id==tid.toUpperCase());D.intent=k.i;
h=`<b>Issue type:</b> ${k.i}<br>${k.e}<br><br><b>Verified facts:</b> ${tx?tx.id+" is "+tx.st+" ("+fmt(tx)+").":"No transaction verified yet."}${la?" Your latest readiness check showed "+la.level+" attention"+(la.f.length?" ("+la.f.map(x=>x[0].toLowerCase()).join(", ")+")":"")+".":""}<br><b>Unknown:</b> Exact reason and timeline, which only PayPal can confirm.<br><b>Next steps:</b> Review account notices, complete requests, keep delivery proof.<br><b>Sources:</b> ${k.s.join(", ")}<br><b>Escalation:</b> ${/block|locked|limit|chargeback|urgent|hold/i.test(t)?"Recommended. Funds or access may be affected.":"Not needed yet. Ask for human support anytime."}`}
D.chat.push({r:"a",h,t:now});D.lastq=t;route();$("#ms").scrollTop=1e5},800);}
function startCase(){D.draft={issue:D.intent||"Transaction Issue",tx:(D.chat.map(m=>m.h).join(" ").match(/TX-\d+/i)||[""])[0].toUpperCase(),pri:"Medium",impact:"Customer awaiting resolution",reason:D.chat.length?"User requested human assistance":"Manual escalation",sum:D.chat.length?"Conversation: "+D.chat.filter(m=>m.r=="u").map(m=>m.h).join(" | "):"No AI conversation yet."};go("/newcase")}
function newcase(){const d=D.draft||(startCase(),D.draft);return shell("cases","Review support case","Check everything before submitting.",`<div class="card" style="max-width:640px"><label>Issue category</label><input id="d1" value="${d.issue}"><label>Transaction reference</label><input id="d2" value="${d.tx}"><label>Priority</label><select id="d3">${pri.map(p=>`<option ${p==d.pri?"selected":""}>${p}</option>`).join("")}</select><label>Customer impact</label><input id="d4" value="${d.impact}"><label>Conversation summary</label><textarea id="d5" rows="4">${d.sum}</textarea><label>Additional information</label><textarea id="d6" rows="2"></textarea><p class="sub">Escalation reason: ${d.reason}. ${D.last?"Readiness: "+D.last.level+" attention.":""}</p><button class="btn" onclick="submitCase()">Submit for support review</button></div>`)}
function submitCase(){const id="CS-"+(1001+D.cases.length),now="2026-11-10";D.cases.push({id,tx:d2.value||"-",cust:D.user?.name||"You",issue:d1.value,pri:d3.value,st:"Submitted",created:now,upd:now,agent:"Unassigned",sum:d5.value+(d6.value?" Extra: "+d6.value:""),hist:[["Case submitted",now]]});D.notifs.unshift({t:"Case "+id+" submitted",d:"Now"});D.draft=null;toast("Case "+id+" submitted");go("/case/"+id)}
function cases(admin){let L=D.cases.filter(c=>(!D.cf||c.st==D.cf)&&(!D.cq||(c.id+c.issue+c.tx).toLowerCase().includes(D.cq.toLowerCase())));
const k=["Total","Open","Under Review","Resolved"],v=[D.cases.length,D.cases.filter(c=>c.st!="Resolved").length,cnt(D.cases,"st","Under Review"),cnt(D.cases,"st","Resolved")];
return shell(D.role=="Customer"?"cases":"cases","Cases","Search, filter and track every case.",`<div class="g g4">${k.map((x,i)=>`<div class="card kpi"><small>${x}</small><b>${v[i]}</b></div>`).join("")}</div><div class="card" style="margin-top:16px"><div style="display:flex;gap:10px;flex-wrap:wrap"><input style="max-width:260px;margin:0" placeholder="Search cases" value="${D.cq||""}" onchange="D.cq=this.value;route()"><select style="max-width:200px;margin:0" onchange="D.cf=this.value;route()"><option value="">All statuses</option>${cst.map(s=>`<option ${D.cf==s?"selected":""} value="${s}">${s}</option>`).join("")}</select><button class="btn sm" onclick="startCase()">New case</button></div>${table(["Case","Issue","Created","Priority","Status","Updated"],L.map(c=>["go('/case/"+c.id+"')",[c.id,c.issue,c.created,tag(c.pri),tag(c.st),c.upd]]))}${L.length?"":'<p class="sub">No cases match. Clear filters or start a new case.</p>'}</div>`)}
function tracker(){const L=D.cases.slice(0,8);return shell("tracker","Complaint Tracker","Progress on your complaints.",`<div class="g g2">${L.map(c=>{const i=cst.indexOf(c.st);return `<div class="card c" style="cursor:pointer" onclick="go('/case/${c.id}')"><b>${c.id}</b> ${c.issue} ${tag(c.st)}<div class="bar" style="margin-top:12px"><i style="width:${(i+1)/5*100}%"></i></div><small class="sub">Step ${i+1} of 5</small></div>`}).join("")}</div>`)}
function caseDetail(id){const c=D.cases.find(x=>x.id==id);if(!c)return shell("cases","Case not found","",'<a class="btn" href="#/cases">Back</a>');const staff=D.role!="Customer";
return shell("cases","Case "+c.id,c.issue+" · "+tag(c.st).replace(/<[^>]+>/g,""),`<div class="g g2"><div class="card"><b>Details</b><p>Customer: ${c.cust}<br>Transaction: <a href="#/tx/${c.tx}">${c.tx}</a><br>Priority: ${tag(c.pri)}<br>Agent: ${c.agent}</p><b>AI summary</b><p>${c.sum}</p>${c.st=="InfoRequired"?'<p style="color:var(--wn)"><b>Action needed:</b> provide the requested documents.</p>':""}${staff?`<label>Update status</label><select onchange="setSt('${c.id}',this.value)">${cst.map(s=>`<option ${s==c.st?"selected":""}>${s}</option>`).join("")}</select><label>Assign agent</label><select onchange="c_ag('${c.id}',this.value)">${agents.map(a=>`<option ${a==c.agent?"selected":""}>${a}</option>`).join("")}</select><label>Internal note</label><input id="nt" placeholder="Visible to staff only"><button class="btn sm" onclick="addNote('${c.id}')">Add note</button>${(D.notes[c.id]||[]).map(n=>`<p class="sub">Note: ${n}</p>`).join("")}`:""}</div><div class="card"><b>Timeline</b><br><br><div class="tl">${c.hist.map(h=>`<div><b>${h[0]}</b><br><small class="sub">${h[1]}</small></div>`).join("")}</div></div></div>`)}
function setSt(id,s){const c=D.cases.find(x=>x.id==id);c.st=s;c.upd="2026-11-10";c.hist.push(["Status changed to "+s.replace(/([a-z])([A-Z])/g,"$1 $2"),"2026-11-10"]);D.notifs.unshift({t:"Case "+id+" is now "+s,d:"Now"});toast("Status updated");route()}
function c_ag(id,a){const c=D.cases.find(x=>x.id==id);c.agent=a;c.hist.push(["Assigned to "+a,"2026-11-10"]);toast("Assigned to "+a)}
function addNote(id){if(!nt.value.trim())return;(D.notes[id]=D.notes[id]||[]).push(nt.value.replace(/</g,"&lt;"));toast("Note added");route()}
function txs(){const f=D.tf||"",s=D.ts||"",L=D.tx.filter(t=>(!f||t.st==f)&&(!s||(t.id+t.cust+t.cat).toLowerCase().includes(s.toLowerCase()))).sort((a,b)=>D.tsort?b.amt-a.amt:0);
return shell("transactions","Transactions",L.length+" records",`<div class="card"><div style="display:flex;gap:10px;flex-wrap:wrap"><input style="max-width:260px;margin:0" placeholder="Search" value="${s}" onchange="D.ts=this.value;route()"><select style="max-width:180px;margin:0" onchange="D.tf=this.value;route()"><option value="">All statuses</option>${["Completed","Pending","OnHold","Failed"].map(x=>`<option ${f==x?"selected":""} value="${x}">${x}</option>`).join("")}</select><button class="btn o sm" onclick="D.tsort=!D.tsort;route()">Sort by amount ${D.tsort?"✓":""}</button></div>${table(["ID","Customer","Amount","Date","Category","Status"],L.map(t=>["go('/tx/"+t.id+"')",[t.id,t.cust,fmt(t)+" "+t.cur,t.date,t.cat,tag(t.st)]]))}${L.length?"":'<p class="sub">No transactions match your filters.</p>'}</div>`)}
function txd(id){const t=D.tx.find(x=>x.id==id);if(!t)return shell("transactions","Not found","",'<a class="btn" href="#/transactions">Back</a>');const rc=D.cases.filter(c=>c.tx==id),ra=D.assess.filter(a=>a.tx==id);
return shell("transactions","Transaction "+t.id,t.cat+" · "+t.date,`<div class="g g2"><div class="card"><h2 style="margin:0">${fmt(t)} ${t.cur}</h2><p>${tag(t.st)} · ${t.cust}</p><b>Timeline</b><div class="tl" style="margin-top:10px"><div>Payment created<br><small class="sub">${t.date}</small></div><div>${t.st}<br><small class="sub">Latest status</small></div></div></div><div class="card"><b>Risk indicators</b><p>${ra.length?ra.map(a=>tag(a.level)+" "+a.id).join(" "):"No assessment linked to this payment."}</p><b>Support history</b>${rc.length?rc.map(c=>`<p><a href="#/case/${c.id}">${c.id}</a> ${c.issue} ${tag(c.st)}</p>`).join(""):"<p class='sub'>No cases yet.</p>"}<a class="btn sm" href="#/support" onclick="D.seed='${t.id}'">Ask AI Support</a></div></div>`)}
function admin(){const k=[["Total Customers",16],["Total Transactions",D.tx.length],["Support Cases",D.cases.length],["Open Cases",D.cases.filter(c=>c.st!="Resolved").length],["High Priority",D.cases.filter(c=>["High","Urgent"].includes(c.pri)).length],["Resolved",cnt(D.cases,"st","Resolved")]];
if(D.role!="Administrator")return shell("admin","Access denied","Administrator role required.",'<a class="btn" href="#/overview">Go back</a>');
return shell("admin","Admin Dashboard","Platform analytics and case management.",`<div class="g g4">${k.map(x=>`<div class="card kpi"><small>${x[0]}</small><b>${x[1]}</b></div>`).join("")}</div><div class="g g2" style="margin-top:16px"><div class="card"><b>Transaction volume</b>${line(byDay())}</div><div class="card"><b>Issue categories</b><br><br>${donut(issues.slice(0,5).map((i,x)=>[i,cnt(D.cases,"issue",i),["#003087","#0070E0","#009CDE","#16875D","#E5A000"][x]]))}</div><div class="card"><b>Attention levels</b><br><br>${donut([["Low",cnt(D.assess,"level","Low"),"#16875D"],["Medium",cnt(D.assess,"level","Medium"),"#E5A000"],["High",cnt(D.assess,"level","High"),"#D64545"]])}</div><div class="card"><b>Support workload</b>${agents.map(a=>`<p style="margin:10px 0 2px">${a} <b>${D.cases.filter(c=>c.agent==a&&c.st!="Resolved").length}</b></p><div class="bar"><i style="width:${D.cases.filter(c=>c.agent==a).length*8}%"></i></div>`).join("")}</div></div><div class="card" style="margin-top:16px"><b>Cases</b>${table(["Case","Issue","Agent","Priority","Status"],D.cases.map(c=>["go('/case/"+c.id+"')",[c.id,c.issue,c.agent,tag(c.pri),tag(c.st)]]))}</div>`)}
function agent(){if(D.role=="Customer")return shell("agent","Access denied","Support role required.",'<a class="btn" href="#/overview">Go back</a>');const me=agents[0],mine=D.cases.filter(c=>c.agent==me&&c.st!="Resolved");
return shell("agent","Agent Workspace","Signed in as "+me,`<div class="g g4">${[["Assigned",mine.length],["High priority",mine.filter(c=>["High","Urgent"].includes(c.pri)).length],["Pending review",mine.filter(c=>c.st=="Submitted"||c.st=="Under Review").length],["Updated today",D.cases.filter(c=>c.upd=="2026-11-10").length]].map(x=>`<div class="card kpi"><small>${x[0]}</small><b>${x[1]}</b></div>`).join("")}</div><div class="card" style="margin-top:16px"><b>My queue</b>${table(["Case","Customer","Issue","Priority","Status"],mine.map(c=>["go('/case/"+c.id+"')",[c.id,c.cust,c.issue,tag(c.pri),tag(c.st)]]))}</div>`)}
const notifs=()=>shell("notifications","Notifications","Case and account updates",`<div class="card">${D.notifs.map(n=>`<p style="border-bottom:1px solid var(--bd);padding-bottom:8px">${n.t}<br><small class="sub">${n.d}</small></p>`).join("")}</div>`);
const settings=()=>shell("settings","Settings","Profile, notifications and security",`<div class="g g2"><div class="card"><b>Profile</b><br><br><label>Name</label><input value="${D.user?.name||""}"><label>Email</label><input value="${D.user?.email||""}"><label>Language</label><select><option>English</option><option>Español</option><option>Deutsch</option></select><button class="btn" onclick="toast('Profile saved')">Save changes</button></div><div class="card"><b>Notifications</b><br><br><label style="display:block"><input type="checkbox" checked style="width:auto;margin-right:8px">Case updates</label><label style="display:block"><input type="checkbox" checked style="width:auto;margin-right:8px">Information requests</label><br><b>Password</b><br><br><input type="password" placeholder="New password"><button class="btn o" onclick="toast('Password updated')">Update password</button></div></div>`);
function route(){const h=location.hash.slice(1)||"/",p=h.split("/"),pub=["","/","/login"];
if(!D.user&&!pub.includes(h)){return go("/login")}
const R={"/":landing,"/login":login,"/overview":overview,"/readiness":readiness,"/holds":holds,"/support":support,"/transactions":txs,"/cases":()=>cases(),"/tracker":tracker,"/notifications":notifs,"/settings":settings,"/admin":admin,"/agent":agent,"/newcase":newcase};
let out=p[1]=="tx"?txd(p[2]):p[1]=="case"?caseDetail(p[2]):(R[h]||landing)();$("#root").innerHTML=out;
if(h=="/support"&&D.seed){ci.value=D.seed;D.seed=null}}
window.addEventListener("hashchange",()=>{route();scrollTo(0,0)});route();
</script></body></html>
